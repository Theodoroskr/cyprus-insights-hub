<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusinessHub.cy — Cyprus Business Intelligence Platform</title>
    <meta name="author" content="BusinessHub.cy" />
    <meta name="google-site-verification" content="sH1UWbREL5Yky7vQ2mLXLGbJ3pl5-Wr-CVltfKz1rfo" />
    <!-- Source sites (e.g. acb.com.cy) swap their photos for a "hotlinked" placeholder when they see our address -->
    <meta name="referrer" content="no-referrer" />

    <!--
      Site-wide fallbacks for crawlers that don't run JavaScript. data-rh="true" lets each
      page's own tags replace these instead of adding a second copy. No canonical/og:url here:
      every route sets one pointing at itself (RouteSEODefaults / SEOHead).
    -->
    <meta data-rh="true" name="description" content="Cyprus business intelligence — company directory, compliance updates, fintech regulation, trade data, and SME tools for professionals." />
    <meta data-rh="true" property="og:title" content="BusinessHub.cy — Cyprus Business Intelligence Platform" />
    <meta data-rh="true" property="og:description" content="Cyprus business intelligence — company directory, compliance updates, fintech regulation, trade data, and SME tools for professionals." />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="BusinessHub.cy" />
    <meta data-rh="true" property="og:image" content="https://businesshub.cy/images/og-businesshub.png" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="BusinessHub.cy — Cyprus Business Intelligence Platform" />
    <meta data-rh="true" name="twitter:description" content="Cyprus business intelligence — company directory, compliance updates, fintech regulation, trade data, and SME tools for professionals." />
    <meta data-rh="true" name="twitter:image" content="https://businesshub.cy/images/og-businesshub.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  </head>
